<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Repo Health Assistant</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">AI Engineering API Wrapper</p>
          <h1>GitHub Repo Health Assistant</h1>
        </div>
        <a class="health-link" href="/health" target="_blank" rel="noreferrer">/health</a>
      </section>

      <section class="controls" aria-label="Repository controls">
        <label>
          <span>Owner</span>
          <input id="ownerInput" type="text" value="fastapi" autocomplete="off" />
        </label>
        <label>
          <span>Repo</span>
          <input id="repoInput" type="text" value="fastapi" autocomplete="off" />
        </label>
        <div class="button-row">
          <button id="rawButton" type="button">Fetch Raw Data</button>
          <button id="analyzeButton" type="button">Analyze Repo</button>
          <button id="reportButton" type="button">Generate LLM Report</button>
        </div>
      </section>

      <section id="status" class="status" role="status">Ready.</section>

      <section class="cards" aria-label="Repository summary">
        <article class="card">
          <span>Health score</span>
          <strong id="scoreValue">-</strong>
        </article>
        <article class="card">
          <span>Grade</span>
          <strong id="gradeValue">-</strong>
        </article>
        <article class="card">
          <span>Stars</span>
          <strong id="starsValue">-</strong>
        </article>
        <article class="card">
          <span>Forks</span>
          <strong id="forksValue">-</strong>
        </article>
        <article class="card">
          <span>Open issues</span>
          <strong id="issuesValue">-</strong>
        </article>
        <article class="card">
          <span>License</span>
          <strong id="licenseValue">-</strong>
        </article>
      </section>

      <section class="columns">
        <article class="panel">
          <h2>Signals</h2>
          <ul id="signalsList" class="list"></ul>
        </article>
        <article class="panel">
          <h2>Risks</h2>
          <ul id="risksList" class="list"></ul>
        </article>
      </section>

      <section class="panel">
        <h2>LLM Report</h2>
        <pre id="reportOutput" class="report-output">No report generated yet.</pre>
      </section>

      <section class="panel">
        <h2>Raw JSON</h2>
        <pre id="jsonOutput" class="json-output">{}</pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
